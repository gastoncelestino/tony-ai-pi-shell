name: Pi runtime

on:
  push:
    branches: [fix/node-22.19.0-pi-runtime, tony-ai-pi-shell, chore/reproducible-dependencies]
  pull_request:
    branches: [tony-ai-pi-shell]

jobs:
  verify-local-pi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts
      - run: bash -n scripts/pi.sh
      - name: Check TypeScript syntax
        run: |
          for file in kernel/*.ts .pi/extensions/*.ts; do
            [ -f "$file" ] || continue
            echo "Checking $file"
            node --check "$file"
          done
      - run: npm run pi:version
      - run: npm run pi -- --version
      - name: Load each project extension in Pi Agent
        run: |
          for extension in .pi/extensions/*.ts; do
            [ -f "$extension" ] || continue
            echo "Loading $extension through Pi Agent"
            npm run pi -- --no-extensions --no-skills --no-prompt-templates --no-themes --extension "$extension" --help > /tmp/pi-extension-help.txt
          done
      - run: npm audit --audit-level=moderate
      - name: Report dependency audit findings
        if: always()
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node --input-type=commonjs -e 'const a=require("/tmp/npm-audit.json"); console.log(JSON.stringify({metadata:a.metadata?.vulnerabilities, vulnerabilities:Object.entries(a.vulnerabilities||{}).map(([name,v])=>({name,severity:v.severity,isDirect:v.isDirect,range:v.range,fixAvailable:v.fixAvailable,via:v.via.map(x=>typeof x==="string"?x:{name:x.name,title:x.title,range:x.range,url:x.url})}))},null,2))'
